<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark light">
<meta name="supported-color-schemes" content="dark light">
<title>{{ subject }}</title>
<style>
  body, table, td { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
  a { text-decoration: none; }
  @media (max-width: 480px) {
    .container { width: 100% !important; }
    .pad { padding-left: 20px !important; padding-right: 20px !important; }
  }
</style>
</head>
<body style="margin:0; padding:0; background-color:#0a0d18;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#0a0d18; padding:32px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" class="container" width="480" cellpadding="0" cellspacing="0" border="0"
             style="width:480px; max-width:100%; background-color:#12172b; border:1px solid #262d4d; border-radius:16px; overflow:hidden;">

        <!-- top accent bar -->
        <tr>
          <td style="height:4px; line-height:4px; font-size:0; background-color:#7c5cff; background-image:linear-gradient(90deg,#7c5cff,#3e7bfa,#22d3e8);">&nbsp;</td>
        </tr>

        <!-- brand -->
        <tr>
          <td class="pad" style="padding:28px 36px 0 36px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#e8eaf6; letter-spacing:.01em;">
                  &#9679;&nbsp; Dark.Account
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- heading + intro -->
        <tr>
          <td class="pad" style="padding:22px 36px 0 36px;">
            <h1 style="margin:0 0 10px 0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:21px; line-height:1.3; font-weight:700; color:#ffffff;">
              {{ heading }}
            </h1>
            <p style="margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:14px; line-height:1.6; color:#9aa2c7;">
              {{ intro }}
            </p>
          </td>
        </tr>

        <!-- code box -->
        <tr>
          <td class="pad" style="padding:26px 36px 6px 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                   style="background-color:#0d1120; border:1px solid #1c2340; border-radius:12px;">
              <tr>
                <td align="center" style="padding:20px 16px;">
                  <span style="font-family:'Consolas','Courier New',monospace; font-size:30px; font-weight:700; letter-spacing:10px; color:#22d3e8;">
                    {{ code }}
                  </span>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- ttl note -->
        <tr>
          <td class="pad" style="padding:14px 36px 0 36px;">
            <p style="margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.6; color:#5d6690;">
              {{ ttl_text }}
            </p>
          </td>
        </tr>

        <!-- divider -->
        <tr>
          <td class="pad" style="padding:26px 36px 0 36px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr><td style="border-top:1px solid #1c2340; font-size:0; line-height:0;">&nbsp;</td></tr>
            </table>
          </td>
        </tr>

        <!-- footer -->
        <tr>
          <td class="pad" style="padding:18px 36px 30px 36px;">
            <p style="margin:0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:12px; line-height:1.6; color:#5d6690;">
              Если вы не запрашивали это действие, просто проигнорируйте это письмо — аккаунт останется в безопасности.
            </p>
            <p style="margin:14px 0 0 0; font-family:'Segoe UI',Helvetica,Arial,sans-serif; font-size:11.5px; color:#3b4166;">
              &copy; {{ year }} Dark.Tehno
            </p>
          </td>
        </tr>

      </table>
    </td>
  </tr>
</table>
</body>
</html>
