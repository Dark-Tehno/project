{% extends "account/base.html" %}
{% block title %}Выход — Dark.Talk{% endblock %}

{% block content %}
<div class="auth-wrap">
  <div class="auth-card card">
    <div class="eyebrow">Dark.Talk</div>
    <h1>Выйти из аккаунта?</h1>
    <p>Вы вошли как <strong>{{ user.username }}</strong>. Сессия на этом устройстве будет завершена.</p>
    <form method="post">
      {% csrf_token %}
      <button type="submit" class="btn grad block">Выйти</button>
    </form>
    <div class="auth-links">
      <a href="{% url 'profile-view' %}">Остаться в аккаунте</a>
    </div>
  </div>
</div>
{% endblock %}
