{% load static %}
<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark.Mail — временная почта</title>
    <meta name="description" content="Dark.Mail — временная почта.">
    <meta name="author" content="Владимир (vsp210) / Dark.Tehno">
    <meta property="og:title" content="Dark.Mail — временная почта">
    <meta property="og:description" content="Dark.Mail — временная почта">
    <meta property="og:image" content="https://vsp210.ru{% static 'images/favicon.png' %}">
    <meta property="og:url" content="https://vsp210.ru/mail/">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;800&family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,700;1,400&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #0a0d18;
            --bg-soft: #0d1120;
            --elevated: #121729;
            --surface: #161c33;
            --surface-2: #1d2440;
            --border: #262d4d;
            --border-soft: #1c2340;
            --text: #e8eaf6;
            --text-muted: #9aa2c7;
            --text-faint: #5d6690;
            --violet: #7c5cff;
            --blue: #3e7bfa;
            --cyan: #22d3e8;
            --good: #3ee6a8;
            --warn: #ffcf7a;
            --bad: #ff7a8a;
            --gradient: linear-gradient(120deg, var(--violet) 0%, var(--blue) 55%, var(--cyan) 100%);
            --font-display: 'Unbounded', sans-serif;
            --font-body: 'Golos Text', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --radius: 16px;
            --radius-sm: 10px;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body.dark {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(1100px 620px at 85% -10%, rgba(124, 92, 255, .16), transparent 60%),
                radial-gradient(900px 500px at -8% 15%, rgba(34, 211, 232, .10), transparent 55%),
                var(--bg);
            color: var(--text);
            font-family: var(--font-body);
            font-size: 16px;
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
        }

        h2,
        h3 {
            font-family: var(--font-display);
            font-weight: 700;
            letter-spacing: -.01em;
            margin: 0;
        }

        a {
            color: var(--cyan);
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        ::selection {
            background: rgba(124, 92, 255, .4);
            color: #fff;
        }

        a:focus-visible,
        button:focus-visible {
            outline: 2px solid var(--cyan);
            outline-offset: 2px;
            border-radius: 6px;
        }

        /* ---------- topbar (matches docs) ---------- */
        .dm-topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px clamp(16px, 4vw, 40px);
            border-bottom: 1px solid var(--border-soft);
            background: rgba(10, 13, 24, .6);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .dm-brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 1.02rem;
            color: var(--text);
        }

        .dm-brand .dot-sep {
            color: var(--text-faint);
            font-weight: 500;
        }

        .dm-topbar-links {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: .86rem;
            color: var(--text-muted);
            font-weight: 500;
        }

        .dm-topbar-links a {
            color: var(--text-muted);
        }

        .dm-topbar-links a:hover {
            color: var(--text);
        }

        /* ---------- page shell ---------- */
        .dm-page {
            max-width: 760px;
            margin: 0 auto;
            padding: clamp(20px, 4vw, 44px) clamp(16px, 4vw, 24px) 70px;
        }

        /* ---------- django messages ---------- */
        .messages-container {
            margin: 0 0 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .messages-container .message {
            border: 1px solid var(--border-soft);
            border-left: 3px solid var(--blue);
            background: var(--surface);
            border-radius: 0 10px 10px 0;
            padding: 11px 16px;
            font-size: .9rem;
            color: var(--text-muted);
        }

        .messages-container .message.success {
            border-left-color: var(--good);
        }

        .messages-container .message.error {
            border-left-color: var(--bad);
        }

        .messages-container .message.warning {
            border-left-color: var(--warn);
        }

        .messages-container .message.info {
            border-left-color: var(--blue);
        }

        /* ---------- inbox container ---------- */
        .inbox-container {
            background: var(--elevated);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 30px 60px -30px rgba(0, 0, 0, .6);
        }

        .email-header {
            padding: clamp(20px, 4vw, 32px);
            border-bottom: 1px solid var(--border-soft);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 20px 28px;
            align-items: center;
            background: linear-gradient(180deg, rgba(124, 92, 255, .06), transparent 60%);
        }

        .email-header h2 {
            grid-column: 1 / -1;
            font-size: 1.02rem;
            font-weight: 600;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: .06em;
            font-family: var(--font-body);
        }

        .email-address-row {
            grid-column: 1;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 10px;
        }

        .email-address {
            font-family: var(--font-mono);
            font-size: clamp(1.05rem, 2.6vw, 1.3rem);
            font-weight: 500;
            color: var(--text);
            background: var(--surface);
            border: 1px solid var(--border-soft);
            border-radius: var(--radius-sm);
            padding: 10px 16px;
            margin: 0;
            word-break: break-all;
        }

        .btn {
            font-family: var(--font-body);
            font-weight: 600;
            font-size: .85rem;
            padding: 10px 16px;
            border-radius: 9px;
            border: 1px solid var(--border-soft);
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            white-space: nowrap;
        }

        .btn:hover {
            border-color: var(--border);
            background: var(--surface-2);
        }

        .btn.copied {
            color: var(--good);
            border-color: var(--good);
        }

        .btn-secondary {
            background: var(--surface);
        }

        #extend-btn {
            background: var(--gradient);
            color: #0a0d18;
            border: none;
            font-weight: 700;
        }

        #extend-btn:hover {
            filter: brightness(1.07);
        }

        /* ---------- expiry ring ---------- */
        .timer {
            grid-column: 2;
            grid-row: 1 / span 2;
            justify-self: end;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: .72rem;
            color: var(--text-faint);
            text-align: center;
        }

        .timer-ring-wrap {
            position: relative;
            width: 92px;
            height: 92px;
        }

        .timer-ring-wrap svg {
            width: 100%;
            height: 100%;
            transform: rotate(-90deg);
        }

        .timer-ring-track {
            fill: none;
            stroke: var(--border-soft);
            stroke-width: 6;
        }

        .timer-ring-progress {
            fill: none;
            stroke: url(#dmRingGrad);
            stroke-width: 6;
            stroke-linecap: round;
            transition: stroke-dashoffset .6s ease, stroke .3s ease;
        }

        .timer-ring-wrap .ring-label {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: var(--font-mono);
            font-size: .92rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
        }

        .timer-ring-wrap .ring-label.long-label {
            font-size: .68rem;
        }

        .timer-caption {
            text-transform: uppercase;
            letter-spacing: .07em;
            font-weight: 600;
        }

        #extend-btn {
            margin-top: 2px;
        }

        /* ---------- inbox list ---------- */
        .dm-inbox-body {
            padding: clamp(18px, 4vw, 28px);
        }

        .dm-inbox-body h3 {
            font-size: 1rem;
            color: var(--text-faint);
            text-transform: uppercase;
            letter-spacing: .07em;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 9px;
        }

        .dm-live-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--good);
            box-shadow: 0 0 8px var(--good);
            animation: dmPulse 2s ease-in-out infinite;
        }

        @keyframes dmPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: .35;
            }
        }

        .email-list {
            list-style: none;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .email-item {
            border: 1px solid var(--border-soft);
            background: var(--surface);
            border-radius: var(--radius-sm);
            overflow: hidden;
            animation: dmFadeIn .35s ease;
        }

        @keyframes dmFadeIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: none;
            }
        }

        .email-item-header {
            padding: 14px 16px;
            cursor: pointer;
            font-size: .9rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .email-item-header:hover {
            background: var(--surface-2);
        }

        .email-item-header strong {
            color: var(--text);
            font-weight: 600;
        }

        .email-item-header small {
            color: var(--text-faint);
            font-size: .8rem;
        }

        .email-item-body {
            padding: 0 16px 16px;
            border-top: 1px solid var(--border-soft);
            font-size: .9rem;
            color: var(--text-muted);
            word-break: break-word;
        }

        .email-item-body:not([style*="display: none"]) {
            padding-top: 14px;
        }

        .no-emails {
            text-align: center;
            padding: 36px 20px;
            color: var(--text-faint);
            font-size: .9rem;
            border: 1px dashed var(--border-soft);
            border-radius: var(--radius-sm);
            list-style: none;
        }

        /* ---------- footer ---------- */
        footer {
            max-width: 760px;
            margin: 34px auto 0;
            padding: 20px clamp(16px, 4vw, 24px) 0;
            border-top: 1px solid var(--border-soft);
            font-size: .8rem;
            color: var(--text-faint);
        }

        footer a {
            color: var(--text-muted);
        }

        @media (max-width:560px) {
            .email-header {
                grid-template-columns: 1fr;
            }

            .timer {
                grid-column: 1;
                grid-row: auto;
                justify-self: start;
                flex-direction: row;
                gap: 14px;
            }

            .email-address-row {
                grid-column: 1;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            html {
                scroll-behavior: auto;
            }

            .email-item {
                animation: none;
            }

            .dm-live-dot {
                animation: none;
            }

            .timer-ring-progress {
                transition: none;
            }
        }
    </style>
</head>
<body class="dark">
    <header class="dm-topbar">
        <div class="dm-brand">
            <svg width="24" height="24" viewBox="0 0 26 26" fill="none">
                <defs><linearGradient id="dmarkTop" x1="2" y1="2" x2="24" y2="24" gradientUnits="userSpaceOnUse">
                    <stop offset="0" stop-color="#7c5cff"/><stop offset="0.55" stop-color="#3e7bfa"/><stop offset="1" stop-color="#22d3e8"/>
                </linearGradient></defs>
                <circle cx="13" cy="13" r="11" stroke="url(#dmarkTop)" stroke-width="2.4"/>
                <path d="M9.5 7.5H13.2C15.9 7.5 18 9.7 18 13C18 16.3 15.9 18.5 13.2 18.5H9.5V7.5Z" stroke="url(#dmarkTop)" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            Dark.Mail
        </div>
        <nav class="dm-topbar-links">
            <a href="{% url 'portfolio' %}">На главную</a>
        </nav>
    </header>
</body>
</html>
