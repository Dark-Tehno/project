<!-- ============================================================
     Portal gate — подключается в index.html:  include "portfolio/portal_gate.html" 
     Показывается только 21 января (по локальной дате посетителя).
     Для проверки в любой день:  /?portal=1   (скрыть: /?portal=0)
     ============================================================ -->
<style>
.pg{
  position:fixed; right:clamp(14px,4vw,48px); bottom:clamp(14px,6vh,56px); z-index:60;
  width:clamp(130px,20vw,210px); display:none; text-align:center;
}
.pg.show{display:block;}
.pg-link{
  display:block; position:relative; aspect-ratio:.72; text-decoration:none !important; color:inherit; cursor:pointer;
  transform:scale(0) rotate(-120deg); opacity:0; -webkit-tap-highlight-color:transparent;
}
.pg.show .pg-link{animation:pgOpen 1.7s cubic-bezier(.2,.9,.25,1.12) .5s forwards;}
@keyframes pgOpen{
  0%{transform:scale(0) rotate(-120deg); opacity:0;}
  35%{opacity:1;}
  100%{transform:scale(1) rotate(0); opacity:1;}
}
.pg-body{position:absolute; inset:0; transition:transform .35s cubic-bezier(.3,1.4,.5,1); animation:pgFloat 5s ease-in-out 2.2s infinite;}
.pg-link:hover .pg-body,.pg-link:focus-visible .pg-body{transform:scale(1.08);}
@keyframes pgFloat{0%,100%{translate:0 0;} 50%{translate:0 -7px;}}

.pg-halo{
  position:absolute; inset:-30%; border-radius:50%;
  background:radial-gradient(ellipse closest-side, rgba(126,224,92,.55), rgba(126,224,92,.15) 55%, transparent 100%);
  filter:blur(14px); animation:pgPulse 2.6s ease-in-out infinite;
}
@keyframes pgPulse{0%,100%{opacity:.75; transform:scale(.96);} 50%{opacity:1; transform:scale(1.06);}}
.pg-disc{
  position:absolute; inset:0; border-radius:50%; filter:url(#pgWobble);
  background:radial-gradient(ellipse closest-side, #021409 0, #0b3d18 38%, #2fb049 58%, #b9ff6e 72%, #86e65f 80%, rgba(134,230,95,0) 100%);
}
.pg-swirl{
  position:absolute; inset:9%; border-radius:50%; filter:url(#pgWobble);
  -webkit-mask-image:radial-gradient(ellipse closest-side, #000 50%, transparent 100%);
  mask-image:radial-gradient(ellipse closest-side, #000 50%, transparent 100%);
}
.pg-swirl.s1{background:conic-gradient(from 0deg, transparent 0, rgba(235,255,200,.55) 12%, transparent 30%, rgba(60,200,90,.6) 55%, transparent 75%); animation:pgSpin 3.2s linear infinite;}
.pg-swirl.s2{inset:22%; background:conic-gradient(from 90deg, transparent 0, rgba(5,40,15,.9) 20%, transparent 45%, rgba(190,255,120,.5) 70%, transparent 90%); animation:pgSpin 2.1s linear infinite reverse;}
@keyframes pgSpin{to{transform:rotate(360deg);}}
.pg-sparks{position:absolute; inset:0; pointer-events:none;}
.pg-sparks i{
  position:absolute; left:50%; top:50%; width:5px; height:5px; margin:-2.5px; border-radius:50%;
  background:#d6ff9c; box-shadow:0 0 8px 2px rgba(150,255,100,.9);
  animation:pgOrbit 4s linear infinite; animation-delay:calc(var(--i) * -.66s);
}
@keyframes pgOrbit{
  from{transform:rotate(0deg) translateX(var(--r,48%)) scaleY(1.35);}
  to{transform:rotate(360deg) translateX(var(--r,48%)) scaleY(1.35);}
}
.pg-cap{
  margin-top:14px; font-family:var(--font-mono); font-size:.74rem; color:var(--text-muted); line-height:1.5;
  opacity:0; animation:pgFade .8s ease 2.4s forwards;
}
.pg-cap b{display:block; color:#b9ff6e; font-weight:700; font-size:.8rem; letter-spacing:.04em;}
@keyframes pgFade{to{opacity:1;}}
.pg-x{
  position:absolute; top:-6px; right:-6px; width:26px; height:26px; border-radius:50%;
  background:var(--surface); border:1px solid var(--border); color:var(--text-muted); cursor:pointer;
  font-size:15px; line-height:1; z-index:2; opacity:0; animation:pgFade .6s ease 2.6s forwards;
}
.pg-x:hover{color:var(--text);}

/* вуаль перехода: расширяется из центра портала */
.pg-veil{
  position:fixed; inset:0; z-index:200; pointer-events:none;
  --x:50%; --y:50%;
  background:radial-gradient(circle at var(--x) var(--y), #f1ffc9 0, #8be860 9%, #2fae3d 26%, #1b7a2a 55%, #14602a 100%);
  clip-path:circle(0 at var(--x) var(--y));
  visibility:hidden;
}
.pg-veil.go{
  visibility:visible;
  clip-path:circle(150vmax at var(--x) var(--y));
  transition:clip-path 1.15s cubic-bezier(.65,0,.25,1);
}
.pg-veil::after{
  content:""; position:absolute; inset:-50%;
  background:conic-gradient(from 0deg, transparent, rgba(255,255,255,.18), transparent 25%, rgba(0,0,0,.25) 50%, transparent 75%);
  animation:pgSpin 1.4s linear infinite;
}
.pg.go .pg-body{animation:none; transform:scale(1.7) rotate(40deg); transition:transform 1.1s cubic-bezier(.65,0,.25,1);}
.pg.go .pg-cap,.pg.go .pg-x{opacity:0; transition:opacity .3s;}

@media (prefers-reduced-motion: reduce){
  .pg-body,.pg-halo,.pg-swirl,.pg-sparks i,.pg-veil::after{animation:none !important;}
  .pg.show .pg-link{animation:none; transform:none; opacity:1;}
  .pg-cap,.pg-x{animation:none; opacity:1;}
  .pg-veil.go{transition:clip-path .3s linear;}
}
</style>

<div class="pg" id="pg" aria-live="polite">
  <button class="pg-x" id="pgClose" type="button" aria-label="Скрыть портал">×</button>
  <a class="pg-link" id="pgLink" href="/portal/" aria-label="Войти в портал — мастерская Dark.Tehno">
    <div class="pg-body">
      <div class="pg-halo"></div>
      <div class="pg-disc"></div>
      <div class="pg-swirl s1"></div>
      <div class="pg-swirl s2"></div>
      <div class="pg-sparks">
        <i style="--i:0;--r:50%"></i><i style="--i:1;--r:44%"></i><i style="--i:2;--r:54%"></i>
        <i style="--i:3;--r:47%"></i><i style="--i:4;--r:52%"></i><i style="--i:5;--r:42%"></i>
      </div>
    </div>
  </a>
  <div class="pg-cap"><b>Портал открылся</b>нажми, чтобы войти</div>
</div>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="pgWobble" x="-25%" y="-25%" width="150%" height="150%">
    <feTurbulence type="fractalNoise" baseFrequency="0.02 0.03" numOctaves="2" seed="4" result="n">
      <animate attributeName="baseFrequency" dur="7s" values="0.02 0.03;0.034 0.02;0.02 0.03" repeatCount="indefinite"/>
    </feTurbulence>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="16" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>
<div class="pg-veil" id="pgVeil"></div>

<script>
(function(){
  "use strict";
  var q = new URLSearchParams(location.search);
  var force = q.get('portal');
  var d = new Date();
  var isJan21 = d.getMonth() === 0 && d.getDate() === 21;
  var show = force === '1' ? true : force === '0' ? false : isJan21;
  if(!show) return;

  var pg = document.getElementById('pg');
  var link = document.getElementById('pgLink');
  var veil = document.getElementById('pgVeil');
  var closeBtn = document.getElementById('pgClose');
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  pg.classList.add('show');

  closeBtn.addEventListener('click', function(){
    pg.classList.remove('show');
  });

  link.addEventListener('click', function(e){
    if(e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    var r = link.getBoundingClientRect();
    veil.style.setProperty('--x', (r.left + r.width/2) + 'px');
    veil.style.setProperty('--y', (r.top + r.height/2) + 'px');
    pg.classList.add('go');
    // два кадра, чтобы transition гарантированно запустился
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ veil.classList.add('go'); }); });
    setTimeout(function(){ location.href = link.getAttribute('href'); }, reduce ? 350 : 1200);
  });

  // возврат кнопкой «назад» (bfcache) — сбрасываем состояние
  window.addEventListener('pageshow', function(ev){
    if(ev.persisted){ veil.classList.remove('go'); pg.classList.remove('go'); }
  });
})();
</script>
