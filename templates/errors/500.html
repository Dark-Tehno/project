<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>500 — Internal Server Error · Dark.Tehno</title>
<style>
:root {
  --bg: #0a0b10;
  --bg-2: #11131b;
  --panel: #141722;
  --border: #242838;
  --text: #e6e8f0;
  --muted: #8a90a6;
  --accent: #8b6cff;
  --accent-2: #3de0b0;
  --danger: #ff5c7a;
  --mono: ui-monospace, "JetBrains Mono", "Fira Code", SFMono-Regular, Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: var(--sans);
  color: var(--text);
  background:
    radial-gradient(900px 500px at 80% -10%, rgba(139,108,255,.16), transparent 60%),
    radial-gradient(700px 420px at -10% 110%, rgba(61,224,176,.10), transparent 60%),
    var(--bg);
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
body::before {
  content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);
  background-size: 48px 48px;
  -webkit-mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
          mask-image: radial-gradient(ellipse at center, #000 20%, transparent 75%);
}
a { color: inherit; text-decoration: none; }

header {
  position: relative; z-index: 1;
  display: flex; align-items: center; justify-content: space-between;
  gap: 16px; flex-wrap: wrap;
  padding: 20px clamp(16px, 5vw, 56px);
  border-bottom: 1px solid var(--border);
  background: rgba(10,11,16,.6);
  backdrop-filter: blur(8px);
}
.logo { font-family: var(--mono); font-weight: 700; letter-spacing: .02em; }
.logo span { color: var(--accent); }
nav { display: flex; gap: 22px; font-size: 14px; color: var(--muted); }
nav a { transition: color .2s; }
nav a:hover { color: var(--text); }

main {
  position: relative; z-index: 1;
  flex: 1;
  display: grid; place-items: center;
  padding: 40px clamp(16px, 5vw, 56px);
}
.wrap { width: 100%; max-width: 720px; }
.eyebrow {
  font-family: var(--mono); font-size: 13px; color: var(--accent-2);
  letter-spacing: .08em; text-transform: uppercase; margin-bottom: 8px;
}
.code {
  font-family: var(--mono); font-weight: 800; line-height: 1;
  font-size: clamp(88px, 22vw, 176px);
  letter-spacing: -.04em;
  background: linear-gradient(120deg, var(--accent), var(--accent-2));
  -webkit-background-clip: text; background-clip: text; color: transparent;
  position: relative; display: inline-block;
}
.code::before, .code::after {
  content: attr(data-code); position: absolute; inset: 0;
  -webkit-background-clip: text; background-clip: text; color: transparent;
  background-image: inherit; opacity: .0;
}
.code:hover::before { animation: glitch 0.4s steps(2) 1; transform: translate(-3px, 1px); opacity: .6; background-image: linear-gradient(120deg, var(--danger), var(--accent)); }
.code:hover::after  { animation: glitch 0.4s steps(2) 1 reverse; transform: translate(3px, -1px); opacity: .6; background-image: linear-gradient(120deg, var(--accent-2), var(--accent)); }
@keyframes glitch { 0% { clip-path: inset(10% 0 60% 0); } 50% { clip-path: inset(55% 0 10% 0); } 100% { clip-path: inset(30% 0 35% 0); } }

h1 { font-size: clamp(24px, 4vw, 34px); margin: 8px 0 10px; }
.lead { color: var(--muted); font-size: 17px; line-height: 1.6; max-width: 56ch; }

.term {
  margin: 28px 0 26px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
  font-family: var(--mono); font-size: 14px;
  box-shadow: 0 20px 50px -20px rgba(0,0,0,.6);
}
.term-bar {
  display: flex; align-items: center; gap: 7px;
  padding: 10px 14px; background: var(--bg-2); border-bottom: 1px solid var(--border);
}
.term-bar i { width: 10px; height: 10px; border-radius: 50%; background: #3a3f55; display: block; }
.term-bar i:nth-child(1) { background: #ff5c7a; }
.term-bar i:nth-child(2) { background: #ffc15c; }
.term-bar i:nth-child(3) { background: #3de0b0; }
.term-bar b { margin-left: 8px; font-weight: 400; color: var(--muted); font-size: 12px; }
.term-body { padding: 16px 18px; line-height: 1.8; overflow-x: auto; }
.term-body .p { color: var(--accent-2); }
.term-body .k { color: var(--muted); display: inline-block; min-width: 7ch; }
.term-body .err { color: var(--danger); }
.term-body .path { color: var(--accent); word-break: break-all; }
.cursor { display: inline-block; width: 8px; height: 1em; background: var(--accent-2); vertical-align: -2px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.actions { display: flex; gap: 12px; flex-wrap: wrap; }
.btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 12px 22px; border-radius: 10px; font-weight: 600; font-size: 15px;
  border: 1px solid var(--border); background: transparent; color: var(--text);
  cursor: pointer; transition: transform .15s, border-color .2s, background .2s;
  font-family: inherit;
}
.btn:hover { transform: translateY(-1px); border-color: var(--accent); }
.btn.primary { background: linear-gradient(120deg, var(--accent), #6a4cf0); border-color: transparent; color: #fff; }
.btn.primary:hover { filter: brightness(1.1); }

footer {
  position: relative; z-index: 1;
  padding: 20px clamp(16px, 5vw, 56px);
  border-top: 1px solid var(--border);
  color: var(--muted); font-size: 13px;
  display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
}
@media (prefers-reduced-motion: reduce) {
  .cursor { animation: none; }
  .code::before, .code::after { animation: none !important; }
}
</style>
</head>
<body>
<header>
  <a class="logo" href="/">Dark<span>.</span>Tehno</a>
  <nav>
    <a href="/dark-lang/">Dark.Lang</a>
    <a href="/account/">Dark.Account</a>
    <a href="https://github.com/vsp210" rel="noopener">GitHub</a>
  </nav>
</header>

<main>
  <div class="wrap">
    <div class="eyebrow">// ошибка</div>
    <div class="code" data-code="500">500</div>
    <h1>Ошибка сервера</h1>
    <p class="lead">Что-то пошло не так на нашей стороне. Мы уже в курсе — попробуйте позже.</p>

    <div class="term" aria-hidden="true">
      <div class="term-bar"><i></i><i></i><i></i><b>vsp210@dark-tehno</b></div>
      <div class="term-body">
        <div><span class="p">$</span> curl -I <span class="path" id="path">/</span></div>
        <div><span class="k">status</span><span class="err">HTTP/1.1 500 Internal Server Error</span></div>
        <div><span class="k">host</span>vsp210.ru</div>
        <div><span class="p">$</span> <span class="cursor"></span></div>
      </div>
    </div>

    <div class="actions">
      <a class="btn primary" href="/">← На главную</a>
      <button class="btn" type="button" onclick="history.length > 1 ? history.back() : location.assign('/')">Назад</button>
    </div>
  </div>
</main>

<footer>
  <span>© 2025-2026 Dark.Tehno. Все права защищены.</span>
  <span>vsp210.ru</span>
</footer>

<script>
  document.getElementById('path').textContent =
    decodeURIComponent(location.pathname + location.search);
</script>
</body>
</html>
